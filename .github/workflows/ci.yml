name: CI
on:
  push:
    branches: [main, 'feature/v2-*']
  pull_request:
  workflow_dispatch:
env:
  PYTHONUTF8: '1'
permissions:
  contents: read
jobs:
  inputs:
    name: Build shared offline bundle inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip download --only-binary=:all: --no-deps pypdf==6.21.4 typing_extensions==4.16.0 --dest dist/dependencies
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: offline-bundle-inputs
          path: dist/
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: inputs
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: offline-bundle-inputs
          path: dist/
      - run: python -m pip install ".[dev]"
      - run: python -m unittest discover -v
      - name: Offline initialization, version and plan/status receipt
        shell: bash
        run: |
          python scripts/release.py dist/CiteCargo-Skill-candidate.zip --kind skill \
            --wheel dist/paper_tool-*-py3-none-any.whl \
            --dependency dist/dependencies/pypdf-*-py3-none-any.whl \
            --dependency dist/dependencies/typing_extensions-*-py3-none-any.whl \
            --receipt-out "dist/validation-${{ matrix.os }}-${{ matrix.python }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-${{ matrix.os }}-${{ matrix.python }}
          path: dist/validation-*.json
      - name: Installed entry points and bundled assets
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          citecargo --version
          paper-tool --version
          python -c 'import pathlib,paper_tool; p=pathlib.Path(paper_tool.__file__).parent; assert (p/"browser/download.mjs").is_file(); assert (p/"web/index.html").is_file()'
  artifacts:
    name: Gate cross-platform offline Skill
    needs: [inputs, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: offline-bundle-inputs
          path: dist/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: validation-*
          path: validation/
          merge-multiple: true
      - name: Require all six runtime validations for one identical payload
        shell: bash
        run: |
          bundle_args=()
          for receipt_file in validation/*.json; do bundle_args+=(--receipt "$receipt_file"); done
          python scripts/release.py dist/CiteCargo-Skill.zip --kind skill \
            --wheel dist/paper_tool-*-py3-none-any.whl \
            --dependency dist/dependencies/pypdf-*-py3-none-any.whl \
            --dependency dist/dependencies/typing_extensions-*-py3-none-any.whl \
            --require-matrix "${bundle_args[@]}"
          python scripts/release.py dist/CiteCargo-source.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: citecargo-validated-distributions
          path: |
            dist/CiteCargo-Skill.zip
            dist/CiteCargo-source.zip
            dist/*.whl
            dist/*.tar.gz
