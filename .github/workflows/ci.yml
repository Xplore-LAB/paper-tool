name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
env:
  PYTHONUTF8: '1'
permissions:
  contents: read
jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # checkout v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # setup-python v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # setup-node v4
        with:
          node-version: '22'
      - run: python -m pip install ".[dev]"
      - run: python -m unittest discover -v
      - run: python -m build
      - name: Installed CLI and bundled browser backend
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          citecargo --version
          paper-tool --version
          python -c 'import pathlib, paper_tool; assert pathlib.Path(paper_tool.__file__).parent.joinpath("browser", "download.mjs").is_file()'
  artifacts:
    name: Build release artifacts
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # checkout v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # setup-python v5
        with:
          python-version: '3.13'
      - run: python -m pip install build
      - run: python -m build
      - run: python scripts/release.py dist/CiteCargo-source.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # upload-artifact v4
        with:
          name: citecargo-distributions
          path: dist/*
